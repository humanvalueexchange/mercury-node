name: Python tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run unit tests
        env:
          PYTHONPATH: src/cli:src/agent
        run: python -m unittest discover -s tests -p 'test*.py' -v
